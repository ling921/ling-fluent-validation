name: Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-pack:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env

      - name: Restore dependencies
        run: dotnet restore Ling.FluentValidation.sln

      - name: Build
        run: dotnet build Ling.FluentValidation.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Verify NuGet package can be created
        shell: bash
        run: |
          for project in \
            src/Ling.FluentValidation.Annotations/Ling.FluentValidation.Annotations.csproj \
            src/Ling.FluentValidation/Ling.FluentValidation.csproj
          do
            dotnet pack "$project" --configuration Release --no-build --no-restore \
              --output artifacts/package -p:ContinuousIntegrationBuild=true
          done

      - name: Verify package boundaries
        shell: bash
        run: |
          annotations=$(find artifacts/package -name 'Ling.FluentValidation.Annotations.*.nupkg' ! -name '*.snupkg' -print -quit)
          runtime=$(find artifacts/package -name 'Ling.FluentValidation.*.nupkg' ! -name '*.Annotations.*' ! -name '*.snupkg' -print -quit)
          unzip -Z1 "$annotations" | grep -Fx 'analyzers/dotnet/cs/Ling.FluentValidation.Analyzers.dll'
          unzip -Z1 "$annotations" | grep -Fx 'analyzers/dotnet/cs/Ling.FluentValidation.CodeFixes.dll'
          unzip -Z1 "$runtime" | grep -Fx 'analyzers/dotnet/cs/Ling.FluentValidation.Generators.dll'

  compatibility-test:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Ling.FluentValidation.sln

      - name: Build
        run: dotnet build Ling.FluentValidation.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests on their target runtimes
        run: dotnet test Ling.FluentValidation.sln --configuration Release --no-build --no-restore --verbosity normal
