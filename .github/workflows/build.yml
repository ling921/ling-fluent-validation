name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version; defaults to the project version
        required: false
        type: string
  release:
    types:
      - published

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/artifacts/package
  PackageVersion: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  compatibility-test:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Ling.FluentValidation.sln

      - name: Build
        run: dotnet build Ling.FluentValidation.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run tests on their target runtimes
        run: dotnet test Ling.FluentValidation.sln --configuration Release --no-build --no-restore --verbosity normal

  publish:
    needs: compatibility-test
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-env

      - name: Restore dependencies
        run: dotnet restore Ling.FluentValidation.sln

      - name: Pack
        shell: bash
        run: |
          version="${PackageVersion#v}"
          for project in \
            src/Ling.FluentValidation.Annotations/Ling.FluentValidation.Annotations.csproj \
            src/Ling.FluentValidation/Ling.FluentValidation.csproj
          do
            arguments=("$project" --configuration Release --no-restore --output "$NuGetDirectory" -p:ContinuousIntegrationBuild=true)
            if [ -n "$version" ]; then arguments+=("-p:Version=$version"); fi
            dotnet pack "${arguments[@]}"
          done

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: |
          packages=$(find "$NuGetDirectory" -maxdepth 1 -name '*.nupkg' ! -name '*.snupkg' -print)
          if [ -z "$packages" ]; then
            echo "No NuGet package was produced." >&2
            exit 1
          fi
          while IFS= read -r package; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done <<< "$packages"
